# 新手财富路线图（面向零基础用户）
# 原则：每条建议都给"为什么/前提/成本/风险/依据"；给的是值得研究的选项与常见类别，
# 最终决策由用户自己做（产品理念第三十节）。
# 完成判定：auto_check 由系统按真实数据判定；manual 由用户在页面上勾选。

stages:
  - id: s0
    title: 第 0 步 · 盘点：知道你有多少钱
    goal: 把现金、存款、各类账户如实记录进系统，建立财富画像的地基。
    auto_check: cash_recorded
    cards:
      - id: s0c1
        title: 把所有现金和存款记进来
        why: |-
          理财的第一步不是买什么，而是知道起点在哪里。没有盘点，一切"配置"都是空中楼阁。
          记录本身会改变行为：多数人记完第一个月，消费就会自觉收敛。
        how: |-
          在本系统 Portfolio 页「＋ 添加账户」建账户（如"工资卡""支付宝""现金"），
          再「＋ 记录资产」录入金额（内容填 CASH:CNY / CASH:HKD，数量即金额）。
          有多少记多少，先不求精确到个位。
        cost: 无
        risk: 无
        evidence: 行为金融学中"记账效应"是最稳定的干预之一；先测量，才能管理。

  - id: s1
    title: 第 1 步 · 安全垫：攒出紧急备用金
    goal: 攒够 3–6 个月的日常支出，放在随取随用的地方。
    auto_check: manual
    cards:
      - id: s1c1
        title: 为什么先攒备用金而不是先投资
        why: |-
          没有备用金的人，遇到失业/医疗等冲击时被迫在低点卖出投资——把纸面波动变成真实亏损。
          备用金的作用是让你的投资"拿得住"。
        how: 目标 = 月支出 × 3~6。放货基/活期等 T+0~T+1 可取的地方，不追求收益。
        cost: 机会成本（这笔钱不做高风险投资）
        risk: 几乎无本金风险（放存款/货基）
        evidence: 3–6 个月支出是各国理财教育的通行实践（CFP 体系、各国监管投教材料）。
      - id: s1c2
        title: 备用金放哪里
        why: 要同时满足"几乎不亏 + 随时能取"。
        how: |-
          常见类别（按流动性排序）：银行活期 → 货币基金（如余额宝类，T+0 快赎有额度）→
          短期定存阶梯（1/3/6 个月各放一份）。不要放股票、长封闭期产品、房产。
        cost: 货基管理费约 0.1–0.3%/年，已在净值中扣除
        risk: 货基非存款、不受存款保险，但历史上本金损失案例极少
        evidence: 货币基金投资于短债/存款/存单，净值波动极小；存款保险覆盖单一银行 50 万以内（内地）。

  - id: s2
    title: 第 2 步 · 账户结构：办什么卡、开什么户
    goal: 用最小的成本把账户结构理顺：日常两张卡起步，跨境需求出现后再扩展。
    auto_check: manual
    cards:
      - id: s2c1
        title: 日常"双卡结构"（人人适用）
        why: 收入与消费分离，月底一眼看清"攒下了多少"，也让自动储蓄成为可能。
        how: |-
          卡 A（工资卡）：只进不出，工资到账次日自动转固定金额到储蓄/货基。
          卡 B（消费卡）：绑定所有支付，每月固定预算。
          两张卡都在你已有银行办即可，不用新开。
        cost: 无（同行转账免费）
        risk: 无
        evidence: 先支付自己（pay yourself first）是储蓄行为学里最有效的默认设置。
      - id: s2c2
        title: 多币种账户与资金通道（人在香港的天然优势）
        why: |-
          你人在香港——境外理财的大门本来就是开的：持香港银行账户即可持有
          HKD/USD 等多币种、FPS 转数快本地转账免费、经香港券商投资全球市场无障碍。
          这一步要做的只是把结构理顺、把成本看清。
        how: |-
          ① 主账户外，考虑开一个低门槛的第二银行账户（比较管理费豁免条件/电汇费/换汇点差）；
          ② 分散角度：现金超过 80 万港元的部分放第二家银行（存保 DPS 每行 80 万上限）；
          ③ 大额换汇前比较银行点差与找换店/平台（合规持牌），点差是最大隐性成本。
        prereq: 香港身份证 + 住址证明
        cost: 部分账户月费（豁免条件各异）；电汇每笔约 100–250 港元
        risk: 机构风险（用存保上限思维分散）；汇率风险在持有外币后出现
        fits: 在港生活/工作者（你）
        not_fits: 短期离港、无多币种需求
        alternatives: 保持单一银行 + 货币基金
        evidence: 香港存款保障计划（DPS，每行 80 万港元）；金管局开放 API 使费用透明可比（调研 docs/research-notes/F）。
      - id: s2c3
        title: 券商账户（人在香港：线上直接开，无需赴港/见证）
        why: 只有开始投资才需要；开早了容易手痒。
        how: |-
          你在香港，所有主流券商都可线上开户（香港身份证+住址证明+银行账户）：
          · 长桥 LongPort：港美股，门槛低、App 体验好，支持 OpenAPI
          · 富途 moomoo：港美股，生态大；本港网点多
          · 老虎证券：港美新澳；OpenAPI 开户入金后可用
          · 盈透 IBKR：全球市场最全、费用透明、Flex 报表天生只读（可接本系统）
          开户时注意两件事：CRS 税务居民地如实填香港；美股记得交 W-8BEN（见课程 w8ben）。
        prereq: 香港身份证 + 住址证明 + 银行账户
        cost: 佣金/平台费各异（每笔约 0–3 美元级别）；港股印花税买卖各 0.1%
        risk: 平台风险（选 SFC 持牌；违约有投资者赔偿基金 ICF 每人 50 万港元）
        fits: 已完成第 1 步备用金、准备执行第 4 步的人（你）
        not_fits: 还没有备用金、或 3 年内要用的钱
        alternatives: 银行渠道买基金/债券（费用高但省心）
        evidence: 本系统券商 API 调研（docs/research-notes/F）：IBKR/长桥/老虎对个人友好且免费；ICF/DPS 为香港法定投资者保护。

  - id: s3
    title: 第 3 步 · 现金管理：让闲钱先赚起来
    goal: 备用金之外的中短期闲钱，放进风险极低、流动性匹配的工具。
    auto_check: manual
    cards:
      - id: s3c1
        title: 三类常见工具对比
        why: 同样是"几乎不亏"的钱，收益差 1–2 个百分点，长期就是可观的复利差。
        how: |-
          ① 货币基金：T+0/T+1，收益跟随短端利率；例：余额宝类、券商现金宝类。
          ② 定期存款/大额存单：锁 3 个月–3 年，利率固定；提前支取损失利息。
          ③ 国债（储蓄国债/国债逆回购）：国家信用，逆回购需证券账户、按期限计息。
          匹配原则：1 年内要用的钱 → 货基/短定存；确定不用的钱才考虑更长期限。
        cost: 货基管理费已含；逆回购有交易佣金（通常极低）
        risk: 货基非存款；定存提前支取损失利息；利率下行时再投资收益降低
        evidence: 收益/流动性/风险三角是货币市场工具的基本框架；本系统机会引擎会监控你的现金占比并提示研究。
      - id: s3c2
        title: 判断"依据"：你的钱多久要用？
        why: 现金管理的全部依据就是期限匹配——期限错了，收益再高也不适合。
        how: |-
          0–3 个月可能用 → 活期/货基；3–12 个月不用 → 短定存/同业存单指数基金；
          1–3 年不用且能接受小幅波动 → 短债基金（注意：有净值波动，非保本）。
        cost: 见上
        risk: 期限错配是现金管理唯一的大风险
        evidence: 久期与流动性匹配是固收管理的基本原则（对应课程《久期》）。

  - id: s4
    title: 第 4 步 · 第一笔投资（可选：满足前提再开始）
    goal: 用长期不用的钱，建立第一个低成本、分散的投资仓位。
    auto_check: investment_started
    prereq_note: 前提：① 备用金已建好 ② 已学完复利/分散/波动相关课程 ③ 这笔钱 3–5 年内不用
    cards:
      - id: s4c1
        title: 小白的常见起点：低成本宽基指数
        why: |-
          统计上，大多数主动基金长期跑不赢指数（SPIVA 十年口径：多数市场超 80% 主动股基落后）。
          宽基指数基金"不选股、不择时、费用极低"，让普通人拿到市场平均回报——
          而市场平均回报已经超过了多数人的实际收益（他们败在追涨杀跌）。
        how: |-
          常见类别（示例用于说明类别，非推荐；买前自行核对费率与跟踪误差）：
          · A 股宽基：沪深300（如 510300）、中证A500、中证全指
          · 美股宽基：标普500（场内 513500 / 香港 3140.HK / 美国 VOO）、纳斯达克100
          · 全球：FTSE 全市场（VT 类）
          方式：场内 ETF（需券商账户，佣金低）或场外指数基金（10 元起定投，无需券商）。
          节奏：常见做法是"定投"——固定日期固定金额，用纪律抹平择时焦虑。
        cost: 指数基金管理费约 0.15–0.5%/年；场内交易有佣金；QDII 有汇差与额度限制
        risk: |-
          股票型指数波动大：历史最大回撤可达 30–50%，跌一半也发生过。
          定投不消除风险，只是摊薄成本；3 年内要用的钱不应该进来。
        fits: 前提三条全部满足的人
        not_fits: 还没备用金 / 无法承受账面浮亏 30% / 短期要用钱
        alternatives: 目标日期基金（一篮子自动再平衡）；先加大第 3 步的现金收益
        evidence: SPIVA 持续统计；约翰·博格《共同基金常识》（成本是回报的最大敌人）；行为金融对择时失败的研究。
      - id: s4c2
        title: 第一笔之后：什么时候加、什么时候停
        why: 新手最大的风险不是选错产品，而是在下跌时恐慌卖出。
        how: |-
          加仓依据：收入结余持续 + 前提未破 → 按计划继续定投，不看盘。
          停止/检视依据：备用金被动用、3 年内出现大额支出计划、或你发现自己天天盯盘焦虑。
          本系统会在你的敞口集中、宏观事件与你相关时提醒你检视——依据永远来自你自己的数据。
        cost: 无
        risk: 无（这是行为纪律，不是收益承诺）
        evidence: 不行动是合法且常是最优的——本系统简报的第一原则（源自 Velora 设计）。
      - id: s4c3
        title: 重要声明
        why: 本页是教育性信息框架。
        how: 具体产品代码仅为类别示例，不构成投资建议；税务/合规（如 CRS、资本利得）请按你的税务居民身份自行确认；最终决策与后果由你承担。
        evidence: 本系统输出契约（架构文档 H5）。

  - id: s5
    title: 第 5 步 · 多元化与再平衡（长期）
    goal: 随资产增长，把鸡蛋放进多个篮子：跨市场、跨资产、跨币种、跨机构。
    auto_check: manual
    cards:
      - id: s5c1
        title: 分散的四个维度
        why: 分散不是提高收益，而是砍掉"归零"型风险——任何单一事件都伤不到你的全部财富。
        how: |-
          市场（A 股/美股/其他）、资产（股/债/现金/另类）、币种（本币/美元…）、机构（银行/券商）。
          本系统 Portfolio 页的五维敞口图就是为这一步设计的：哪里超过阈值，哪里就是下一个研究方向。
        cost: 跨市场有汇差与税务成本
        risk: 过度分散导致难以管理
        evidence: 组合理论常识；本系统敞口引擎（架构文档 H3）。
      - id: s5c2
        title: 每年一次再平衡
        why: 涨跌会让组合偏离设计比例，风险悄悄变大；再平衡强制"高抛低吸"。
        how: 设定目标比例（如 70/30），偏离 ±5 个百分点时调回；用新钱调整优先于卖出（省税费）。
        cost: 卖出可能触发税务事件
        risk: 无
        evidence: 课程《再平衡》；主要指数长期的波动率差异研究。

  - id: s6
    title: 第 6 步 · 合规与税务基础（境外理财必修 · 人在香港）
    goal: 看懂 CRS/W-8BEN/香港税制/美国遗产税/投资者保护/外汇合规——境外理财的法律地图。
    auto_check: manual
    cards:
      - id: s6c1
        title: 五分钟搞懂你的税务身份与申报
        why: 境外理财的第一课不是选产品，是搞清楚"谁有权对我的钱收税、谁会知道我的账户"。
        how: |-
          ① 你的税务居民地是香港（画像已按此设置）→ CRS 下账户信息报给香港税局；
          ② 开券商时 CRS 申报如实填香港；
          ③ 交 W-8BEN 声明非美税务居民。
          逐条学 Learn 页 legal_tax 域的 6 节课：CRS → W-8BEN → 香港税速览 →
          美国遗产税 → 香港投资者保护 → 涉内地资金合规（如适用）。
        cost: 无
        risk: 不懂规则的"隐形风险"：30% 股息预扣、遗产税、机构集中
        evidence: 香港 IRD 与 OECD CRS 官方框架；IRS W-8BEN 说明；香港存保计划 DPS 与投资者赔偿基金 ICF 条例。
      - id: s6c2
        title: 重要边界
        why: 本系统教概念框架，不提供税务/法律意见。
        how: 规则会变、个案有别：大额资金安排、身份规划、跨境传承，请咨询持牌税务师/律师并以 IRD/SFC/IRS 官方发布为准。
        evidence: 系统输出契约（架构文档 H5：不产生假确定性）。
