# Wealth Academy 课程库 v2（12 基础 + 6 合规税务 + 6 微观宏观）
# quiz = 简单题（概念层）；quiz_hard = 进阶场景题（应用层，掌握度 ≥0.3 自动解锁）
# prereq: 前置概念（known 后新概念才全额优先）；importance 1-5

lessons:
  # ── 基础 ────────────────────────────────────────────
  - concept: compound_interest
    domain: basics
    title: 什么是复利？
    prereq: []
    importance: 5
    body: |
      复利是"利息生利息"：每期的收益加入本金，下一期一起计息。
      10 万本金年化 6%，10 年后约 17.9 万——其中近 8 万是利息的利息。
    example: 就像滚雪球：坡够长（时间）比坡够陡（收益率）更值得追求。
    quiz:
      q: 年化 6% 下，本金翻倍大约需要多少年？（72 法则）
      options: ["6 年", "12 年", "20 年"]
      answer: 1
    quiz_hard:
      q: 同样年化 6%，甲现在投 10 万放 30 年；乙 10 年后才投 10 万放 20 年。30 年后差额约？
      options: ["约 10 万", "约 21 万", "约 32 万"]
      answer: 1

  - concept: inflation
    domain: basics
    title: 什么是通胀？
    prereq: []
    importance: 5
    body: |
      通胀是物价水平的持续上涨，它让"现金的购买力"每年缩水。
      3% 通胀下，今天的 100 元，10 年后只能买到今天约 74 元的东西。
    example: 现金不是"无风险"资产——它对购买力有确定性风险。
    quiz:
      q: 通胀主要侵蚀哪类资产的实际价值？
      options: ["股票", "现金与活期存款", "黄金"]
      answer: 1
    quiz_hard:
      q: 名义利率 4%、通胀 5%，你的存款实际利率是多少？
      options: ["+4%", "-1%", "+9%"]
      answer: 1

  - concept: risk_return
    domain: basics
    title: 风险与收益
    prereq: []
    importance: 4
    body: |
      收益是承担风险的补偿。同类资产中"明显更高收益"的报价，几乎总意味着
      更高的亏损概率、更差的流动性或更复杂的条款——三者至少占其一。
    example: 5% 的"保本高收益"产品值得先问：风险藏在哪？
    quiz:
      q: 收益率显著高于同类时，最合理的假设是？
      options: ["捡到便宜", "风险/流动性/复杂度在别处", "发行方慷慨"]
      answer: 1
    quiz_hard:
      q: 两只基金长期年化都是 8%，但 A 最大回撤 15%、B 曾跌 40%。3 年后要用钱的人应选？
      options: ["B，收益一样", "A，回撤深度影响到期可用性", "无所谓"]
      answer: 1

  - concept: liquidity
    domain: basics
    title: 什么是流动性？
    prereq: []
    importance: 4
    body: |
      流动性是"想用钱时能多快、以多小代价变现"。活期存款流动性最高；
      定期存款提前支取损失利息；房产变现可能要数月并折价。
    example: 紧急备用金必须放在高流动性资产里——因为急用钱的时间不可预测。
    quiz:
      q: 紧急备用金最适合放在？
      options: ["房产", "活期/货币基金", "3 年期锁定产品"]
      answer: 1
    quiz_hard:
      q: 你有 50 万，半年后要付首付。最合理的安排是？
      options: ["全买股票博一把", "货币基金/短定存", "30 年国债吃高息"]
      answer: 1

  - concept: etf
    domain: instruments
    title: 什么是 ETF？
    prereq: [inflation]
    importance: 5
    body: |
      ETF（交易型开放式指数基金）像"一篮子股票"的一个份额，盘中随时买卖。
      宽基 ETF 跟踪指数（如标普 500、日经 225），费用通常远低于主动基金。
    example: 买 VOO ≈ 按市值比例买下 500 家美国大公司，无需选股。
    quiz:
      q: 宽基指数 ETF 的主要优点是？
      options: ["保证跑赢市场", "低成本+天然分散", "没有波动"]
      answer: 1
    quiz_hard:
      q: 两只标普500 ETF 跟踪同一指数：A 管理费 0.03%，B 收 0.60%。持 10 年费差约？
      options: ["约 0.6%", "约 6%", "没有差别"]
      answer: 1

  - concept: asset_allocation
    domain: portfolio
    title: 什么是资产配置？
    prereq: [etf]
    importance: 5
    body: |
      资产配置是决定"多少钱在股票、债券、现金、其他"的比例。
      研究普遍显示，长期收益与波动的差异，大头来自配置比例而非选股择时。
    example: 60/40 指 60% 股票+40% 债券；你的比例应匹配你的期限与风险容量。
    quiz:
      q: 对长期回报影响最大的决策通常是？
      options: ["选哪只股票", "股债现金的比例", "哪一天买入"]
      answer: 1
    quiz_hard:
      q: 闲钱 20 年不用的人 vs 5 年内买房的人，股票占比应该？
      options: ["完全一样", "前者更高、后者更低", "后者更高"]
      answer: 1

  - concept: diversification
    domain: portfolio
    title: 什么是分散化？
    prereq: [etf]
    importance: 4
    body: |
      分散化是让"任何单一事件都伤不到你的全部财富"：跨资产、跨国家、跨币种、跨机构。
      分散不是提高收益，而是砍掉"归零"型风险。
    example: 账户+持仓+币种都集中在单一国家/机构时，一次事件就是全仓风险。
    quiz:
      q: 分散化的目标是？
      options: ["收益最大化", "降低单一事件的整体伤害", "消除一切风险"]
      answer: 1
    quiz_hard:
      q: 你满仓本行业公司股票，且工资也来自该公司。最大问题是？
      options: ["没有问题", "职业与投资风险同源，失业与亏损会同时发生", "股票太少"]
      answer: 1

  - concept: rebalancing
    domain: portfolio
    title: 什么是再平衡？
    prereq: [asset_allocation]
    importance: 4
    body: |
      再平衡是把涨跌后偏离的比例调回目标配置。它强制"高抛低吸"，
      让组合风险回到你当初设计的水平。
    example: 目标 60/40，股票大涨后变 70/30 → 卖股买债回到 60/40。
    quiz:
      q: 再平衡的本质是？
      options: ["追涨杀跌", "纪律化的高抛低吸", "预测市场"]
      answer: 1
    quiz_hard:
      q: 目标 70/30，现在 78/22，恰有新工资入账。通常最优操作是？
      options: ["全仓卖出股票", "新钱只买债，自然调回", "什么都不做"]
      answer: 1

  - concept: money_market_fund
    domain: instruments
    title: 什么是货币市场基金？
    prereq: [liquidity]
    importance: 4
    body: |
      货基投资于短期存款/短期国债等，净值波动极小，收益跟随短端利率，
      申赎通常 T+0/T+1。它是"现金的收益率升级版"，不是存款（不受存款保险）。
    example: 美联储维持高利率时，美元货基年化可能显著高于活期。
    quiz:
      q: 货币市场基金与银行存款的关键区别是？
      options: ["收益更高且保本", "不受存款保险保障", "流动性更差"]
      answer: 1
    quiz_hard:
      q: 央行快速降息周期中，货基与锁定利率定存的相对表现？
      options: ["货基收益更快跟随下行", "货基永远更高", "无差别"]
      answer: 0

  - concept: tbill
    domain: instruments
    title: 什么是 Treasury Bill（短期国债）？
    prereq: [money_market_fund]
    importance: 4
    body: |
      T-Bill 是美国财政部发行的 ≤1 年期贴现国债，按面值折价买入、到期按面值兑付。
      被视为"无信用风险"的美元资产之一，二级市场流动性极好。
    example: 以 98.0 买入 3 个月期 T-Bill，到期兑 100，年化约 8.2%（示例数字）。
    quiz:
      q: T-Bill 的收益形式是？
      options: ["每季度付息", "折价买入到期按面值兑付", "随股价波动"]
      answer: 1
    quiz_hard:
      q: 非美税务居民持有 T-Bill，美国税务上通常？
      options: ["利息免预扣税", "利息扣 30%", "按遗产征税"]
      answer: 0

  - concept: duration
    domain: fixed_income
    title: 什么是久期（Duration）？
    prereq: [money_market_fund]
    importance: 4
    body: |
      久期衡量债券价格对利率的敏感度：久期 5 年的债券，利率+1% → 价格约 -5%（近似）。
      期限越长久期越大。持有到期则拿回面值，中间的波动只是"账面"的。
    example: 同样加息 1%，1 年期定存几乎无感，30 年期国债可能跌 15%+。
    quiz:
      q: 利率上升时，久期越长的债券价格？
      options: ["跌得越多", "跌得越少", "不变"]
      answer: 0
    quiz_hard:
      q: 这笔钱 2 年后要用。市场预期未来一年降息。更稳妥的是？
      options: ["30 年久期债基博最大涨幅", "短久期债基，回撤小且也受益降息", "股票"]
      answer: 1

  - concept: fx_and_returns
    domain: macro
    title: 为什么汇率会影响我的收益？
    prereq: [etf]
    importance: 5
    body: |
      你持有外币资产的实际收益 = 资产本身涨跌 × 汇率变动。
      即使日股上涨，若日元对你的本币贬值 10%，你的本币收益可能被吃掉大半。
    example: 10% 的日股涨幅 - 8% 的日元贬值 ≈ 本币口径只赚约 1.2%。
    quiz:
      q: 外币资产的本币收益由什么决定？
      options: ["只有资产涨跌", "资产涨跌×汇率变动", "只有汇率"]
      answer: 1
    quiz_hard:
      q: 你持有美元资产，1 年后要在港买楼（港币与美元挂钩）。美元大涨的净影响？
      options: ["资产增值且买楼力不变", "资产本币增值但楼价挂钩美元也变贵，净影响小", "只有坏处"]
      answer: 1

  # ── 合规与税务（香港居民）────────────────────────────
  - concept: crs
    domain: legal_tax
    title: CRS 是什么？你的账户信息会报给谁？
    prereq: []
    importance: 5
    body: |
      CRS（共同申报准则）是 100 多个税收管辖区之间的金融账户信息自动交换机制，
      香港 2018 年起参与。银行/券商每年识别账户持有人的"税务居民地"，
      并把账户余额、利息股息、卖出所得报给该税务机关。
      关键：CRS 按"税务居民地"交换，不是按国籍。
    example: 你在香港券商持有美股，开户表的 CRS 申报如实填香港即可——申报≠交税。
    quiz:
      q: CRS 信息交换的依据是？
      options: ["国籍", "税务居民地", "开户银行所在地"]
      answer: 1
    quiz_hard:
      q: 某人持内地护照但常住香港、为香港税务居民。其香港账户 CRS 下报给？
      options: ["内地税务局", "香港税局", "不申报"]
      answer: 1

  - concept: w8ben
    domain: legal_tax
    title: W-8BEN 与美股股息的 30% 预扣税
    prereq: [crs]
    importance: 5
    body: |
      W-8BEN 是交给美国券商的表，声明"我不是美国人"。要点：
      ① 美股股息会被美国预扣税——香港税务居民 30%；
      ② 资本利得对非美税务居民不征美国税；③ 美国国债利息通常免税。
      表约每 3 年更新，地址变了要重交。
    example: 收到 100 美元股息 → 券商自动扣 30 美元给 IRS，到账 70 美元。
    quiz:
      q: 非美税务居民买卖美股的价差收益（资本利得）？
      options: ["被美国征 30%", "一般不征美国税", "和股息一样预扣"]
      answer: 1
    quiz_hard:
      q: 100 万美元投美股：甲买 5% 股息率的高息股，乙买不派息成长股。10 年股息预扣税差（香港居民）约？
      options: ["无差别", "甲累计多缴约 15 万美元", "乙多缴"]
      answer: 1

  - concept: hk_tax_basics
    domain: legal_tax
    title: 香港个人税速览：为什么适合理财
    prereq: []
    importance: 5
    body: |
      香港对个人：无资本利得税，无股息税，本地存款利息一般免税；
      薪俸税标准税率 15%，无销售税。买卖港股有印花税（买卖双方各 0.1%）。
    example: 同样赚 1 万美元美股价差：香港税务居民 0 税；美国税务居民可能要交资本利得税。
    quiz:
      q: 香港税务居民买卖美股赚的差价？
      options: ["交香港薪俸税", "香港不征资本利得税", "交 15%"]
      answer: 1
    quiz_hard:
      q: 哪笔操作在香港税务下最可能产生成本差异？
      options: ["买港股收股息", "频繁买卖港股（印花税累积）", "美元存款利息"]
      answer: 1

  - concept: us_estate_tax
    domain: legal_tax
    title: 别忽视：美股的美国遗产税风险
    prereq: [w8ben]
    importance: 4
    body: |
      非美税务居民持有的"美国资产"（美股/美债/美国基金）合计超过 6 万美元，
      身故时可能面临最高 40% 的美国遗产税，且几乎没有免税额。
      香港与美国之间没有遗产税协定。涉大额请咨询专业人士。
    example: 100 万美元美股组合的传承成本可能高达数十万美元——"隐形风险"。
    quiz:
      q: 非美税务居民持有美股的美国遗产税免税门槛约为？
      options: ["6 万美元", "500 万美元", "没有门槛也不征"]
      answer: 0
    quiz_hard:
      q: 降低美股遗产税敞口的思路不包括？
      options: ["控制美国资产占比", "考虑非美注册的同类指数产品", "多买几只美股分散"]
      answer: 2

  - concept: hk_investor_protection
    domain: legal_tax
    title: 香港的投资者保护网（钱放在哪才安全）
    prereq: []
    importance: 4
    body: |
      三层保护：① 银行存款——存款保障计划（DPS）每行 80 万港元上限；
      ② 券商——选 SFC 持牌，违约有投资者赔偿基金（ICF）每人每券商 50 万港元；
      ③ 了解你的股票登记方式（实货/CCASS）。
    example: 300 万现金放一家银行只有 80 万受保；分三家则每家的 80 万都受保。
    quiz:
      q: 香港存款保障计划目前每人每行上限是？
      options: ["50 万港元", "80 万港元", "100 万港元"]
      answer: 1
    quiz_hard:
      q: 250 万港元现金求稳，最优安排是？
      options: ["一家大银行", "三家银行各存约 83 万", "全放券商买货基"]
      answer: 1

  - concept: fx_control_cn
    domain: legal_tax
    title: 资金涉及内地时的合规要点（如适用）
    prereq: [crs]
    importance: 4
    body: |
      若资金或身份涉及内地：① 内地居民每年 5 万美元便利化购汇额度，且用途不含
      境外买房/证券投资；② 仍构成中国税务居民者，境外所得可能涉及申报义务；
      ③ 规则复杂会变——大额安排前咨询专业税务/法律人士。
    example: 人在香港工作、资金在港赚在港存，一般不涉及内地购汇额度。
    quiz:
      q: 内地居民每年便利化购汇额度是？
      options: ["1 万美元", "5 万美元", "无限制"]
      answer: 1
    quiz_hard:
      q: 内地朋友想经你的香港账户"绕道"投美股。正确做法？
      options: ["帮忙走账", "拒绝——规避外汇管制的通道有法律风险", "只帮一次"]
      answer: 1

  # ── 微观经济学 ──────────────────────────────────────
  - concept: opportunity_cost
    domain: micro_economics
    title: 机会成本：理财的第一性原理
    prereq: []
    importance: 5
    body: |
      机会成本 = 为选 A 而放弃的最好选项的价值。现金"没亏"的假象，
      是因为损失以"本可赚到"的形式隐形存在。
    example: 10 万现金躺活期 3 年（0.3%），同期短债 4%——机会成本约 1.1 万。
    quiz:
      q: 持有现金的机会成本是？
      options: ["为零", "它本可获得的合理无风险收益", "通胀率"]
      answer: 1
    quiz_hard:
      q: 提前还 3% 房贷 vs 投资同风险 4.5% 产品，哪个更优？
      options: ["一定提前还贷", "数学上投资更优，但要考虑确定性与心理承受", "一定投资"]
      answer: 1

  - concept: supply_demand
    domain: micro_economics
    title: 供给、需求与价格
    prereq: []
    importance: 4
    body: |
      价格由供给与需求的相对力量决定。金融市场的"供需"就是买卖盘：
      利率是"钱的价格"，汇率是"货币的相对价格"。
    example: 降息=钱变便宜 → 通常推升资产价格、压低货币汇率。
    quiz:
      q: 利率是钱的价格——意味着降息时？
      options: ["借钱更贵", "借钱更便宜，通常利好资产价格", "无影响"]
      answer: 1
    quiz_hard:
      q: 某商品供给中断但需求刚性，价格最可能？
      options: ["小幅波动", "大幅上涨（刚性需求=涨价也照买）", "下跌"]
      answer: 1

  - concept: market_structure
    domain: micro_economics
    title: 竞争结构：为什么有的公司毛利率 70%
    prereq: [supply_demand]
    importance: 5
    body: |
      完全竞争的行业利润薄如刀片（航空、大宗商品）；有护城河的公司
      （品牌/网络效应/专利/转换成本）能长期维持高价——高毛利的来源。
      读财报时，毛利率能否持续取决于竞争结构。
    example: 白酒龙头毛利 90%+ 而航空公司常年个位数——行业结构使然。
    quiz:
      q: 长期高毛利率最可能来自？
      options: ["行业竞争激烈", "护城河（品牌/网络效应等）", "运气"]
      answer: 1
    quiz_hard:
      q: 一家公司毛利率 50% 且五年持续抬升，最合理的解释是？
      options: ["会计手法", "定价权增强或产品结构升级", "成本上升"]
      answer: 1

  # ── 宏观经济学 ──────────────────────────────────────
  - concept: gdp_cycle
    domain: macro_economics
    title: GDP 与经济周期：你的资产在哪个季节
    prereq: []
    importance: 5
    body: |
      经济沿"扩张→过热→放缓→衰退"循环。股票是领先指标（提前定价），
      就业是滞后指标。周期无法精确预测，但决定你组合的"季节感"。
    example: 衰退期股市往往先于经济见底——跌最深时常是布局期，不是逃跑期。
    quiz:
      q: 股市与经济周期的关系是？
      options: ["完全同步", "股市通常领先于经济", "股市滞后"]
      answer: 1
    quiz_hard:
      q: 失业率创新低、通胀加速、央行连续加息。周期位置最可能是？
      options: ["复苏早期", "过热期", "衰退末段"]
      answer: 1

  - concept: monetary_transmission
    domain: macro_economics
    title: 货币政策传导：加息如何一路传到你的钱包
    prereq: [fx_and_returns]
    importance: 5
    body: |
      央行加息 → 贷款更贵 → 消费投资降温 → 企业利润承压 → 股票估值下降
      （分母效应）→ 本币走强（息差吸引资金）→ 你的外币资产换算缩水。
      一条链，五个环节，都指向你的组合。
    example: 2022 年美联储加息：美债跌、成长股跌、美元涨——三个环节同时发生。
    quiz:
      q: 加息对股票估值的最直接影响是？
      options: ["提高估值", "提高贴现率压低估值", "无影响"]
      answer: 1
    quiz_hard:
      q: 你持有美元现金 + 日股 ETF。美联储加息、日银按兵不动，最可能的双重影响？
      options: ["美元现金收益升 + 日股承压且日元贬值", "两者都受益", "两者都受损"]
      answer: 0

  - concept: jobs_data
    domain: macro_economics
    title: 就业数据为什么让市场颤抖
    prereq: [gdp_cycle]
    importance: 4
    body: |
      非农就业/失业率是央行判断"经济是否过热"的关键证据。
      数据太强=通胀风险=可能加息（利空股债）；太弱=衰退风险（也利空）。
      市场要的是"金发姑娘"——不好不坏。
    example: 就业爆强 → 加息预期升温 → 股债双跌；这就是"好消息=坏消息"。
    quiz:
      q: 就业数据超预期强劲时，市场通常担心？
      options: ["衰退", "通胀与更多加息", "通缩"]
      answer: 1
    quiz_hard:
      q: 好消息就是坏消息——这种市场环境最典型于什么周期？
      options: ["复苏早期", "央行抗通胀的紧缩周期", "长期萧条"]
      answer: 1
