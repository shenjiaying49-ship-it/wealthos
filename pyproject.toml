[project]
name = "wealthos"
version = "0.1.0"
description = "AI Personal Wealth Intelligence OS — local-first personal CFO"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wealthos = "wealthos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wealthos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
